# Reusable workflow: build a multi-arch OCI image with Nix and push to GHCR.
#
# Builds amd64 and arm64 in parallel, then merges into a multi-arch manifest.
# Uses docker/metadata-action for tag generation (not skopeo).
#
# Tag behaviour:
#   push to main → :latest-{arch} per job, then :latest manifest
#   push vX.Y.Z tag → :X.Y.Z-{arch} and :X.Y-{arch} per job,
#                     then :latest, :X.Y.Z, :X.Y manifests
#
# Caller example:
#   on:
#     push:
#       branches: [main]
#       tags: ['v[0-9]+.[0-9]+.[0-9]+']
#   jobs:
#     publish:
#       uses: genebean/.github/.github/workflows/publish-container.yml@main
#       with:
#         image: ghcr.io/genebean/my-app
#         nix-package: container

on:
  workflow_call:
    inputs:
      image:
        description: 'Full GHCR image name (e.g. ghcr.io/genebean/ytdlfin)'
        required: true
        type: string
      nix-package:
        description: 'Nix attribute under .#packages.$SYSTEM to build (default: container)'
        required: false
        default: container
        type: string

jobs:
  build-push:
    name: Build (${{ matrix.nix-system }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            nix-system: x86_64-linux
            tag-suffix: amd64
          - runner: ubuntu-24.04-arm
            nix-system: aarch64-linux
            tag-suffix: arm64

    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build OCI archive
        run: nix build .#packages.${{ matrix.nix-system }}.${{ inputs.nix-package }}

      - name: Load image into Docker
        id: load
        run: |
          loaded=$(docker load < result 2>&1 | grep 'Loaded image:' | sed 's/Loaded image: //')
          echo "local-tag=${loaded}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=latest-${{ matrix.tag-suffix }}
            type=semver,pattern={{version}}-${{ matrix.tag-suffix }}
            type=semver,pattern={{major}}.{{minor}}-${{ matrix.tag-suffix }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag and push platform image
        env:
          LOCAL_TAG: ${{ steps.load.outputs.local-tag }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag "${LOCAL_TAG}" "${tag}"
            docker push "${tag}"
          done <<< "${TAGS}"

  merge-manifest:
    name: Merge multi-arch manifest
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools create \
              --tag "${tag}" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done <<< "${TAGS}"
