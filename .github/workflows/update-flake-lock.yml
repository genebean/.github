# Reusable workflow: update Nix flake inputs and derived npm dependency hashes.
#
# The caller defines the schedule and triggers; this workflow handles the update.
# Pass secrets.token with a PAT when generated pull requests should trigger CI
# automatically. Pass secrets.nix_access_token when the flake reads private
# GitHub inputs. Repositories with npmDepsHash should explicitly identify both
# their package-lock.json and the Nix files that contain the derived hash.
#
# Caller example (Monday schedule):
#   on:
#     schedule:
#       - cron: "0 6 * * 1"
#     workflow_dispatch:
#   jobs:
#     update:
#       uses: genebean/.github/.github/workflows/update-flake-lock.yml@main
#       with:
#         npm-lock-file: package-lock.json
#         npmDepsHash-glob: pkgs/*.nix
#       secrets:
#         token: ${{ secrets.CI_FLAKE_UPDATES }}
#         nix_access_token: ${{ secrets.CI_PRIVATE_FLAKE_READ }}

on:
  workflow_call:
    inputs:
      npm-lock-file:
        description: 'Lock file consumed by prefetch-npm-deps when npmDepsHash-glob is set'
        required: false
        default: 'package-lock.json'
        type: string
      npmDepsHash-glob:
        description: 'Glob of Nix files whose single npmDepsHash assignment should be refreshed. Empty = skip.'
        required: false
        default: ''
        type: string
    secrets:
      token:
        description: 'Optional PAT for PR creation (falls back to GITHUB_TOKEN)'
        required: false
      nix_access_token:
        description: 'Optional read token for private GitHub flake inputs'
        required: false

jobs:
  update:
    name: update Nix dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15

      # Keep the read token out of the environment of earlier third-party
      # actions. Nix reads this per-user configuration when updating inputs.
      - name: Configure private flake authentication
        if: ${{ secrets.nix_access_token != '' }}
        env:
          NIX_ACCESS_TOKEN: ${{ secrets.nix_access_token }}
        run: |
          umask 077
          mkdir -p "$HOME/.config/nix"
          printf 'access-tokens = github.com=%s\n' "$NIX_ACCESS_TOKEN" >> "$HOME/.config/nix/nix.conf"

      - name: Update flake inputs
        run: nix flake update

      - name: Refresh npm dependency hashes
        if: ${{ inputs.npmDepsHash-glob != '' }}
        env:
          NPM_DEPS_HASH_GLOB: ${{ inputs.npmDepsHash-glob }}
          NPM_LOCK_FILE: ${{ inputs.npm-lock-file }}
        run: |
          set -euo pipefail

          if [[ "$NPM_LOCK_FILE" = /* || "$NPM_LOCK_FILE" == *".."* ]]; then
            echo "::error::npm-lock-file must be a repository-relative path without '..'"
            exit 1
          fi
          if [[ ! -f "$NPM_LOCK_FILE" ]]; then
            echo "::error::npm lock file not found: $NPM_LOCK_FILE"
            exit 1
          fi

          npm_deps_hash="$(nix run nixpkgs#prefetch-npm-deps -- "$NPM_LOCK_FILE")"
          if [[ ! "$npm_deps_hash" =~ ^sha256-[A-Za-z0-9+/=]+$ ]]; then
            echo "::error::prefetch-npm-deps returned an unexpected hash"
            exit 1
          fi

          python3 - "$npm_deps_hash" <<'PY'
          import glob
          import os
          from pathlib import Path
          import re
          import sys

          pattern = os.environ["NPM_DEPS_HASH_GLOB"]
          if Path(pattern).is_absolute() or ".." in Path(pattern).parts:
              raise SystemExit("npmDepsHash-glob must stay within the repository")

          root = Path.cwd().resolve()
          paths = sorted({Path(match) for match in glob.glob(pattern, recursive=True)})
          if not paths:
              raise SystemExit(f"npmDepsHash-glob matched no files: {pattern}")

          assignment = re.compile(
              r'(?m)^(?P<prefix>\s*npmDepsHash\s*=\s*)"[^"]*"(?P<suffix>\s*;\s*(?:#.*)?)$'
          )
          new_hash = sys.argv[1]

          for path in paths:
              resolved = path.resolve()
              if not resolved.is_relative_to(root) or not resolved.is_file():
                  raise SystemExit(f"refusing non-file or out-of-repository match: {path}")

              original = path.read_text()
              updated, count = assignment.subn(
                  lambda match: f'{match.group("prefix")}"{new_hash}"{match.group("suffix")}',
                  original,
              )
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one npmDepsHash assignment in {path}, found {count}"
                  )

              path.write_text(updated)
              print(f"updated {path}")
          PY

      - name: Create dependency update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update_flake_lock_action
          delete-branch: true
          title: "chore: update Nix dependencies"
          body: |
            Automated Nix dependency updates.

            This pull request may update `flake.lock` and explicitly configured derived `npmDepsHash` values.
          labels: "dependencies,nix"
          commit-message: "chore: update Nix dependencies"
          sign-commits: true
          token: ${{ secrets.token || github.token }}
