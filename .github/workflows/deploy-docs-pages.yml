# Deploys docs/ to GitHub Pages on every push to main that touches docs/.
# No build step — Pages serves the HTML files directly.
# Requires: repo Settings → Pages → Source = "GitHub Actions"
#
# Caller example:
#   on:
#     push:
#       branches: [main]
#       paths: ['docs/**']
#   jobs:
#     deploy:
#       uses: genebean/.github/.github/workflows/deploy-docs-pages.yml@main

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
