# Reusable workflow: run nix build with flake freshness check.
#
# Caller examples:
#
#   # Basic (no npmDepsHash, no NixOS config test):
#   jobs:
#     nix-build:
#       uses: genebean/.github/.github/workflows/nix-build.yml@main
#
#   # With npmDepsHash guard and NixOS module evaluation:
#   jobs:
#     nix-build:
#       uses: genebean/.github/.github/workflows/nix-build.yml@main
#       with:
#         npmDepsHash-glob: pkgs/social-reader.nix
#         nixos-config-test: true
#
#   # nix flake check instead of nix build:
#   jobs:
#     nix-build:
#       uses: genebean/.github/.github/workflows/nix-build.yml@main
#       with:
#         npmDepsHash-glob: pkgs/*.nix
#         build-command: nix flake check

on:
  workflow_call:
    inputs:
      npmDepsHash-glob:
        description: 'Glob of Nix files to check for placeholder npmDepsHash. Empty = skip.'
        required: false
        default: ''
        type: string
      build-command:
        description: 'Primary Nix build command'
        required: false
        default: 'nix build'
        type: string
      nixos-config-test:
        description: 'Build .#nixosConfigurations.test to catch module evaluation errors'
        required: false
        default: false
        type: boolean
    secrets:
      ATTIC_TOKEN:
        description: 'Push+pull token for the genebean Attic cache (attic.home.technicalissues.us). Optional - caller passes it with `secrets: inherit`.'
        required: false

jobs:
  nix-build:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # Pull config has to land before any build/check step below so they can
      # actually substitute from the cache. Gated on the secret existing so
      # callers that haven't set ATTIC_TOKEN (or a fork PR, which never gets
      # secrets) still build fine, just without the speedup.
      - name: Configure Attic cache (pull)
        if: ${{ secrets.ATTIC_TOKEN != '' }}
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          echo "machine attic.home.technicalissues.us password $ATTIC_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          {
            echo "NIX_CONFIG<<ATTIC_NIX_CONFIG_EOF"
            echo "extra-substituters = https://attic.home.technicalissues.us/genebean"
            echo "extra-trusted-public-keys = genebean:bS9FNZbGEXaJzMJzN5eEva28eCKqDlRC61uC8NdWWL4="
            echo "netrc-file = $HOME/.netrc"
            echo "ATTIC_NIX_CONFIG_EOF"
          } >> "$GITHUB_ENV"
      - uses: DeterminateSystems/flake-checker-action@v14
        with:
          fail-mode: true
      - name: Ensure npmDepsHash is not the placeholder value
        if: inputs.npmDepsHash-glob != ''
        env:
          GLOB: ${{ inputs.npmDepsHash-glob }}
        run: |
          # shellcheck disable=SC2086
          if grep -qF 'sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' $GLOB; then
            echo "::error::npmDepsHash is still the placeholder in ${GLOB}. Run 'nix build', copy the hash, and commit."
            exit 1
          fi
      - name: Build
        env:
          BUILD_CMD: ${{ inputs.build-command }}
        run: $BUILD_CMD
      - name: NixOS module evaluation
        if: inputs.nixos-config-test
        run: nix build .#nixosConfigurations.test.config.system.build.toplevel
      # Only meaningful when build-command left ./result behind - nix flake
      # check callers have nothing to push.
      - name: Push to Attic
        if: ${{ secrets.ATTIC_TOKEN != '' && inputs.build-command == 'nix build' }}
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix run nixpkgs#attic-client -- login genebean https://attic.home.technicalissues.us "$ATTIC_TOKEN" --set-default
          nix run nixpkgs#attic-client -- push genebean ./result
